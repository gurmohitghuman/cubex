name: Release

# Publishes a draft release made by scripts/release.sh (see docs/releasing.md).
# It tests the exact commit the draft points at (CI, plus a real install with
# the one-line installers on Linux and Windows, and an update from the latest
# release on both), and only then publishes the draft. Publishing is
# what creates the vX.Y.Z tag, so a failed run leaves no tag behind, and
# `cubex update` only ever sees versions that passed.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to test and publish (vX.Y.Z)
        required: true

# One release at a time; never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Find the draft's commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # drafts are only visible to a token that can write
    outputs:
      sha: ${{ steps.draft.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve the draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$TAG' isn't vX.Y.Z"; exit 1; }
          draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          target="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
          [ "$draft" = true ] || { echo "::error::$TAG is already published"; exit 1; }
          sha="$(git rev-parse --verify "$target^{commit}")"
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$TAG points at $sha, which isn't on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$TAG -> $sha"

  ci:
    name: CI
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  build-dist:
    name: Build release archive
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build

      - name: Verify and package built app
        run: |
          set -euo pipefail
          test -f server/dist/index.js
          test -f server/dist/package.json
          test -f server/dist/db/migrations/001_schema.sql
          test -f client/dist/index.html
          mkdir -p release-assets
          tar --format=posix -czf release-assets/cubex-dist.tar.gz server/dist client/dist
          (cd release-assets && sha256sum cubex-dist.tar.gz > cubex-dist.tar.gz.sha256)
          entries="$(tar -tzf release-assets/cubex-dist.tar.gz)"
          test -n "$entries"
          while IFS= read -r entry; do
            case "$entry" in
              server/dist|server/dist/*|client/dist|client/dist/*) ;;
              *) echo "::error::Unexpected entry in archive: $entry"; exit 1 ;;
            esac
            case "/$entry/" in
              */../*|*\\*) echo "::error::Unsafe path in archive: $entry"; exit 1 ;;
            esac
          done <<< "$entries"
          stage="$(mktemp -d)"
          tar -xzf release-assets/cubex-dist.tar.gz -C "$stage"
          test -f "$stage/server/dist/index.js"
          test -f "$stage/server/dist/package.json"
          test -f "$stage/server/dist/db/migrations/001_schema.sql"
          test -f "$stage/client/dist/index.html"
          rm -rf "$stage"

      - name: Upload built archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubex-dist
          path: |
            release-assets/cubex-dist.tar.gz
            release-assets/cubex-dist.tar.gz.sha256
          retention-days: 1

  install:
    name: One-line install
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Install, start and reach Cubex
        env:
          CUBEX_HOME: ${{ runner.temp }}/cubex/home
          CUBEX_BIN_DIR: ${{ runner.temp }}/cubex/bin
        run: |
          set -euo pipefail
          bash install.sh --source . --port 3091 --no-service --no-modify-path
          curl -fsS --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:3091/api/health
          echo
          "$CUBEX_BIN_DIR/cubex" status
          "$CUBEX_BIN_DIR/cubex" stop

  install-windows:
    name: One-line install on Windows
    needs: resolve
    uses: ./.github/workflows/install-windows.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  install-unix:
    name: Update the latest release on Linux
    needs: resolve
    uses: ./.github/workflows/install-unix.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  publish:
    name: Publish
    needs: [resolve, ci, build-dist, install, install-windows, install-unix]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download built archive
        uses: actions/download-artifact@v4
        with:
          name: cubex-dist
          path: release-assets

      - name: Attach archive and publish the draft (this creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum -c cubex-dist.tar.gz.sha256)
          gh release upload "$TAG" release-assets/cubex-dist.tar.gz release-assets/cubex-dist.tar.gz.sha256 --clobber
          gh release edit "$TAG" --draft=false --latest
          tagged="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
          [ "$tagged" = "$SHA" ] || { echo "::error::$TAG was tagged at $tagged, expected $SHA"; exit 1; }
          echo "Published $TAG at $SHA: https://github.com/$GH_REPO/releases/tag/$TAG"
