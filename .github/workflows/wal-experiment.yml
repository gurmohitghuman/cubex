name: WAL experiment

# Temporary (removed before review): WAL commit times on each runner by how the -wal file was prepared
# (scripts/wal-growth-experiment.mjs).

on:
  pull_request:

jobs:
  experiment:
    name: WAL experiment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run the experiment
        env:
          WAL_ROUNDS: '60'
        run: node scripts/wal-growth-experiment.mjs
