name: WAL experiment

# Temporary (removed before review): hiring-summarize-big's first pass, repeated on each runner, with the -wal
# file grown from empty or preallocated (tests/unit/wal-growth-passes.experiment.ts).

on:
  pull_request:

jobs:
  experiment:
    name: WAL experiment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run the experiment
        shell: bash
        env:
          WAL_PASSES: '40'
        run: |
          d=$(mktemp -d)
          DB_PATH="$d/unit.db" TMPDIR="$d" TEMP="$d" TMP="$d" npx tsx tests/unit/wal-growth-passes.experiment.ts \
            | grep -v 'Migration applied'
