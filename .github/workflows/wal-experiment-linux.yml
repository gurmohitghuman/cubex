name: WAL experiment (Linux)

# Temporary (removed before review): the full unit suite on the Linux runner, as CI runs it, with a DISK line before
# each test file (free disk, data waiting to be written, the test folders kept so far; UNIT_DISK_TRACE) and vmstat
# every second, to see what the disk is doing when run-clear-big.test.ts runs (its clears print WALX lines).

on:
  pull_request:

jobs:
  experiment:
    name: WAL experiment (Linux suite ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: The disk
        run: |
          df -h / /tmp
          findmnt -no SOURCE,FSTYPE,OPTIONS /
          lsblk -o NAME,SIZE,ROTA,MODEL,SCHED
          grep -E '^(MemTotal|Dirty|Writeback):' /proc/meminfo
          sysctl vm.dirty_ratio vm.dirty_background_ratio vm.dirty_expire_centisecs vm.dirty_bytes vm.dirty_background_bytes
      - name: The unit suite, traced
        shell: bash
        run: |
          vmstat -t -w 1 > vmstat.log &
          echo $! > vmstat.pid
          UNIT_DISK_TRACE=1 npm run test:unit > suite.log 2>&1 || true
          kill "$(cat vmstat.pid)" || true
          grep -E '^(DISK|WALX|FAIL|\[x\]|\[done\])' suite.log
          echo "== vmstat"
          cat vmstat.log
