name: WAL experiment (Linux)

# Temporary (removed before review): run-clear-big.test.ts on the Linux runner, 40 runs with the -wal file made its
# full size at each reset and 40 with it grown from empty (WAL_EXPERIMENT), alternating within each job, so both ways
# share each machine. Each clear prints a WALX line.

on:
  pull_request:

jobs:
  experiment:
    name: WAL experiment (Linux ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run the experiment
        shell: bash
        run: |
          for p in 1 2 3 4 5; do
            if [ $(( (p + ${{ matrix.shard }}) % 2 )) -eq 0 ]; then order="grown sized"; else order="sized grown"; fi
            for mode in $order; do
              WAL_EXPERIMENT=$mode node scripts/unit-tests.mjs run-clear-big > "out-$p-$mode.log" 2>&1 || true
              grep -E '^(WALX|FAIL)' "out-$p-$mode.log" | sed "s/^/shard ${{ matrix.shard }} run $p: /"
            done
          done
