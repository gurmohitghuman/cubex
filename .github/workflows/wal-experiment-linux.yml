name: WAL experiment (Linux)

# Temporary (removed before review): the unit tests that bound a bulk writer's time, on the Linux runner, with
# writers waiting for a running checkpoint (WAL_WAIT=on, this PR) or writing on meanwhile (off, as before), 4 times
# each way per job, alternating, so both ways share each machine.

on:
  pull_request:

jobs:
  experiment:
    name: WAL experiment (Linux ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: The bounded tests, writers waiting for checkpoints or not
        shell: bash
        run: |
          for p in 1 2 3 4; do
            if [ $(( (p + ${{ matrix.shard }}) % 2 )) -eq 0 ]; then order="off on"; else order="on off"; fi
            for mode in $order; do
              WAL_WAIT=$mode node scripts/unit-tests.mjs transform-wal-wait transform-regex-worker bulk-wal-upkeep \
                bulk-wal-short column-trash-moving run-undo-jobs formula-follow-pages > "out-$p-$mode.log" 2>&1 || true
              grep -E '^(FAIL|\[x\]|\[done\])|round took|queued after|answered in|no cell after|slowest transactions|^ +\{"(ms|first)"' \
                "out-$p-$mode.log" | cut -c1-200 | sed "s/^/shard ${{ matrix.shard }} run $p $mode: /"
            done
          done
