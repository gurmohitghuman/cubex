name: Windows install

# The real one-line installer (irm ... | iex) from this commit on Windows, in Windows PowerShell like most PCs:
# install, `cubex status` answering on /api/health, an update that rebuilds and swaps, then an uninstall that leaves
# nothing behind. On pull requests and pushes to main that touch the installer or the dependencies; the Release
# workflow calls it for the commit being released.

on:
  pull_request:
    paths:
      - install.ps1
      - 'bin/**'
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/install-windows.yml
  push:
    branches: [main]
    paths:
      - install.ps1
      - 'bin/**'
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/install-windows.yml
  workflow_call:
    inputs:
      ref:
        description: Commit to test (the caller's commit when empty)
        type: string
        default: ''
  workflow_dispatch:

concurrency:
  group: install-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: One-line install (Windows ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      # Both report, so an ARM-only failure is never hidden behind an x64 one.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    defaults:
      run:
        shell: powershell
    env:
      ARCH: ${{ matrix.arch }}
      # The commit under test, from the repository it lives in (a fork's, for a fork's pull request).
      CUBEX_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      CUBEX_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Note the user PATH, and whether this commit runs here
        id: before
        run: |
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $path = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\user-path.txt", $path)
          # While the lockfile has argon2 (no ARM64 build for Windows), the installer refuses Windows on ARM rather
          # than reach for a compiler: then this job checks that refusal, and nothing more.
          $raw = "https://raw.githubusercontent.com/$env:CUBEX_REPO/$env:CUBEX_REF"
          $lock = Invoke-WebRequest -UseBasicParsing "$raw/package-lock.json"
          $refused = $env:ARCH -eq 'arm64' -and $lock.Content.Contains('"node_modules/argon2"')
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "refused=$("$refused".ToLower())`n")

      # Each later step is a new process that hasn't seen the PATH change, so it runs the command by its full path.
      - name: Install with the one-liner
        run: |
          irm "https://raw.githubusercontent.com/$env:CUBEX_REPO/$env:CUBEX_REF/install.ps1" | iex
          $code = $LASTEXITCODE
          if ('${{ steps.before.outputs.refused }}' -ne 'true') { exit $code }
          if ($code -ne 1) { throw "The installer should refuse Windows on ARM here, but it exited with $code." }
          if (Test-Path "$env:LOCALAPPDATA\cubex") { throw 'The refused install left the cubex folder behind.' }
          exit 0 # the refusal was expected; Actions would otherwise end the step with its exit code, 1

      - name: cubex status answers on /api/health
        if: steps.before.outputs.refused != 'true'
        run: |
          & "$env:LOCALAPPDATA\cubex\bin\cubex.cmd" status
          if ($LASTEXITCODE) { exit 1 }
          & "$env:LOCALAPPDATA\cubex\bin\cubex.cmd" status --quiet
          if ($LASTEXITCODE) { throw 'cubex status --quiet says Cubex is not running' }
          $health = Invoke-RestMethod -UseBasicParsing http://127.0.0.1:3002/api/health
          if ($health.status -ne 'ok') { throw "Unhealthy: $($health | ConvertTo-Json -Compress)" }

      - name: Update (rebuild, swap, restart)
        if: steps.before.outputs.refused != 'true'
        run: |
          & "$env:LOCALAPPDATA\cubex\bin\cubex.cmd" update --force
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA\cubex\app.previous")) { throw 'No app.previous: nothing was swapped' }
          & "$env:LOCALAPPDATA\cubex\bin\cubex.cmd" status --quiet
          if ($LASTEXITCODE) { throw 'Cubex is not running after the update' }

      - name: Uninstall leaves nothing behind
        if: steps.before.outputs.refused != 'true'
        run: |
          'delete' | & "$env:LOCALAPPDATA\cubex\bin\cubex.cmd" uninstall --delete-data
          if ($LASTEXITCODE) { exit 1 }
          $left = @()
          if (Test-Path "$env:LOCALAPPDATA\cubex") { $left += 'the cubex folder' }
          if (Get-ScheduledTask -TaskName Cubex -ErrorAction Ignore) { $left += 'the Cubex scheduled task' }
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment')
          $path = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if ($path -cne [IO.File]::ReadAllText("$env:RUNNER_TEMP\user-path.txt")) {
            $left += "a changed user PATH ($path)"
          }
          $mine = Get-CimInstance Win32_Process | Where-Object {
            $_.ExecutablePath -like "$env:LOCALAPPDATA\cubex\*" -or $_.CommandLine -like '*\cubex\app\bin\cubex.ps1*'
          }
          if ($mine) { $left += "processes ($($mine.Name -join ', '))" }
          try { Invoke-WebRequest -UseBasicParsing -TimeoutSec 3 http://127.0.0.1:3002/api/health | Out-Null
            $left += 'a server on port 3002' } catch { }
          if ($left) { throw "Left behind: $($left -join '; ')" }

      - name: Show the logs
        if: failure()
        run: |
          Get-ChildItem "$env:LOCALAPPDATA\cubex\logs" -ErrorAction Ignore | ForEach-Object {
            "===== $($_.FullName)"; Get-Content $_.FullName -Tail 80 -Encoding UTF8
          }
