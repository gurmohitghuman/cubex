name: CI

# Runs on every push to main and every pull request: typecheck, unit tests,
# build, on Linux and on native Windows (checks.yml, once for each, with the
# unit tests split over 3 runners). The Release workflow calls it too, on
# the commit being released. The Playwright e2e suite runs in e2e.yml, on
# pull requests that change the app or its tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (the caller's commit when empty)
        type: string
        default: ''

# Cancel in-progress runs when a new commit lands on the same branch.
# Saves CI minutes during back-to-back pushes. The workflow name (the
# caller's, when called) keeps a Release run apart from the push run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/checks.yml
    with:
      os: ubuntu-latest
      ref: ${{ inputs.ref }}

  # Native Windows (no WSL): npm runs scripts through cmd.exe there, and
  # installs and test processes start slower.
  windows:
    name: Windows
    uses: ./.github/workflows/checks.yml
    with:
      os: windows-latest
      ref: ${{ inputs.ref }}

  # One result for each platform, under the name its single job had before the
  # split. The Linux one is the required status check on main: keep its name as
  # is. It runs whatever happened before it (always()), so a part that failed,
  # was cancelled or was skipped makes it fail; a skipped result would count as
  # passed.
  linux-result:
    name: Typecheck + Unit tests + Build
    needs: linux
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Linux part passed
        env:
          RESULT: ${{ needs.linux.result }}
        run: |
          echo "Typecheck, build and the 3 unit test runners on Linux: $RESULT"
          test "$RESULT" = success

  windows-result:
    name: Typecheck + Unit tests + Build (Windows)
    needs: windows
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows part passed
        env:
          RESULT: ${{ needs.windows.result }}
        run: |
          echo "Typecheck, build and the 3 unit test runners on Windows: $RESULT"
          test "$RESULT" = success
