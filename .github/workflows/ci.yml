name: CI

# Runs on every push to main and every pull request: typecheck, unit tests,
# build, on Linux and on native Windows. The Release workflow calls it too, on
# the commit being released. The Playwright e2e suite needs a browser and a
# booted server, so it runs locally (npm run e2e:all), not here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (the caller's commit when empty)
        type: string
        default: ''

# Cancel in-progress runs when a new commit lands on the same branch.
# Saves CI minutes during back-to-back pushes. The workflow name (the
# caller's, when called) keeps a Release run apart from the push run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The Linux name is the required status check on main: keep it as is.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # Both report, so a Windows-only failure is never hidden behind a Linux one.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Typecheck + Unit tests + Build
            timeout: 10
          # Native Windows (no WSL): npm runs scripts through cmd.exe there, and
          # installs and test processes start slower. Some Windows runners are
          # about 1.8 times slower than others, which takes main's own 15-minute
          # run past 25 minutes.
          - os: windows-latest
            name: Typecheck + Unit tests + Build (Windows)
            timeout: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          # Pin a major. Passwords hash with Node's own crypto.argon2, which
          # arrived in Node 24.7; the installers and the Docker image run
          # Node 24 too. Its npm 11 is also what generates the lockfile.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # `npm ci` is stricter than `npm install`: it requires a
        # package-lock.json, fails if the lock is out of sync, and never
        # mutates package.json. The right thing for CI.
        run: npm ci

      - name: Typecheck (server + client)
        # Hits both tsconfig.json files in one command.
        run: npm run typecheck

      - name: Unit tests
        # Pure helpers plus the SQL-vs-schema check (tests/unit/sql-schema.test.ts).
        # No server, no network; each test gets its own temp DB_PATH (scripts/unit-tests.mjs).
        run: npm run test:unit

      - name: Build (server + client)
        # Catches the cases typecheck misses: SQL migrations missing from
        # the copy step, broken Vite plugin config, missing dist outputs.
        run: npm run build

      - name: Verify build outputs exist
        # Belt and braces: confirm the artifacts that production needs
        # actually got produced. If the build "succeeds" but produces no
        # dist/, the deploy will fail mysteriously. Bash on Windows too (Git Bash).
        shell: bash
        run: |
          set -e
          test -f server/dist/index.js
          test -f server/dist/package.json
          test -d server/dist/db/migrations
          test -f client/dist/index.html
          ls server/dist/db/migrations/*.sql | wc -l | xargs -I{} test {} -gt 0
          echo "✓ all build outputs present"
